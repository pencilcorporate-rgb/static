<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* ตั้งค่าสีให้ตรงกับธีมของ Telegram */
        body {
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #222222);
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container { text-align: center; padding: 20px; }
        .user-photo { width: 100px; border-radius: 50%; border: 3px solid var(--tg-theme-button-color); }
        button {
            background-color: var(--tg-theme-button-color, #248bed);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="greeting">สวัสดี!</h1>
        <p>นี่คือ Mini App แรกของคุณ</p>
        <button id="main-btn">ส่งข้อมูลกลับไปที่บอท</button>
    </div>

    <script>
        // เริ่มต้นใช้งาน Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // ทำให้แอปเปิดขึ้นมาเต็มหน้าจอ

        // แสดงชื่อผู้ใช้จาก Telegram
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('greeting').innerText = `สวัสดีคุณ ${user.first_name}!`;
        }

        // เมื่อกดปุ่ม
        document.getElementById('main-btn').addEventListener('click', () => {
            tg.sendData("Hello from Mini App!"); // ส่งข้อความกลับไปที่บอท
            tg.close(); // ปิดแอป
        });
    </script>
</body>
</html>
