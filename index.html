<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STATIC Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e0e0e;
            --card-bg: #1c1c1c;
            --primary-green: #a2ff00;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- Header Section --- */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: var(--primary-green); }

        .search-bar {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            width: 55%;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            margin-left: 10px;
            outline: none;
            width: 100%;
            font-size: 14px;
        }

        /* --- Banner Slide Section (ห้ามหาย) --- */
        .banner-container {
            padding: 0 20px;
            margin-bottom: 25px;
        }

        .banner-slide {
            background: #1c1c1c;
            height: 180px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .banner-slide i {
            color: #333;
            font-size: 80px;
        }

        .dots {
            position: absolute;
            bottom: 15px;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #333;
            border-radius: 50%;
        }

        .dot.active {
            background: var(--text-muted);
        }

        /* --- Product Menu (Horizontal Card) --- */
        .menu-container {
            padding: 0 20px 120px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 30px;
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 15px;
        }

        .item-image-box {
            width: 100px;
            height: 100px;
            background: #2a2a2a;
            border-radius: 25px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .item-info h3 {
            font-size: 20px;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .item-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.3;
        }

        .tag-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .tag {
            background: linear-gradient(90deg, #38ef7d, #a2ff00);
            color: black;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 15px;
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
            border-top: 1px solid #222;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
        }

        .nav-item.active { color: var(--primary-green); }
        .nav-item i { font-size: 22px; }
        
        .badge {
            background: var(--primary-green);
            color: black;
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 10px;
            position: absolute;
            top: -5px;
            right: -10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt" style="color: var(--primary-green);"></i> STATIC
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: #444;"></i>
            <input type="text" placeholder="ค้นหาสินค้า">
        </div>
    </header>

    <!-- Banner Slide Section -->
    <div class="banner-container">
        <div class="banner-slide">
            <i class="fa-regular fa-image"></i>
            <div class="dots">
                <div class="dot"></div>
                <div class="dot active"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <!-- Product Menu -->
    <div class="menu-container">
        <div class="item-card">
            <div class="item-image-box">
                <img src="Product.jpg" alt="Product">
            </div>
            <div class="item-info">
                <h3>Creator <br>Pod Clear</h3>
                <p>ประเภท: หัวพอต ใช้แล้วทิ้ง<br>ใช้ร่วมกับ Creator Device</p>
                <div class="tag-row">
                    <div class="tag">Disposable</div>
                </div>
            </div>
        </div>
        
        <!-- รายการเพิ่มเติม -->
        <div class="item-card">
            <div class="item-image-box">
                <i class="fa-regular fa-image" style="color:#333; font-size:30px;"></i>
            </div>
            <div class="item-info">
                <h3>Marbro</h3>
                <p>หอมสดชื่นถึงใจ</p>
                <div class="tag-row">
                    <div class="tag">Disposable</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-percent"></i><span>โปรโมชัน</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>สินค้าที่ชอบ</span></a>
        <a href="#" class="nav-item active"><i class="fa-solid fa-box-open"></i><span>สินค้า</span></a>
        <a href="#" class="nav-item" style="position: relative;">
            <i class="fa-solid fa-cart-shopping"></i><span class="badge">20</span><span>รถเข็น</span>
        </a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>โปรไฟล์</span></a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0e0e0e';
    </script>
</body>
</html>
