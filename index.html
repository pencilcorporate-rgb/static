<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STATIC Mini App</title>
    <!-- เรียกใช้ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e0e0e;
            --card-bg: #1c1c1c;
            --primary-green: #a2ff00;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Header & Logo */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo span { color: var(--primary-green); }

        .search-bar {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            width: 50%;
        }

        .search-bar input {
            background: transparent;
            border: none;
            color: white;
            margin-left: 10px;
            outline: none;
            width: 100%;
        }

        /* Banner Carousel (Placeholder) */
        .banner {
            width: calc(100% - 40px);
            height: 200px;
            background: #252525;
            margin: 0 auto 20px;
            border-radius: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .banner::after {
            content: "•••";
            position: absolute;
            bottom: 15px;
            color: var(--text-muted);
            letter-spacing: 5px;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px 100px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .item-image {
            background: #2a2a2a;
            height: 80px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #444;
            font-size: 30px;
        }

        .item-info h3 {
            font-size: 14px;
            margin: 0;
            margin-bottom: 5px;
        }

        .item-info p {
            font-size: 10px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.2;
        }

        .tag {
            align-self: flex-end;
            background: linear-gradient(90deg, #38ef7d, #a2ff00);
            color: black;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 5px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #222;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
        }

        .nav-item.active { color: var(--primary-green); }
        .nav-item i { font-size: 20px; }

        .cart-badge {
            position: relative;
        }

        .badge {
            position: absolute;
            top: -5px;
            right: -10px;
            background: var(--primary-green);
            color: black;
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 50%;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt" style="color: var(--primary-green);"></i> STATIC
        </div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: #555;"></i>
            <input type="text" placeholder="ค้นหาสินค้า">
        </div>
    </header>

    <div class="banner">
        <i class="fa-regular fa-image fa-3x"></i>
    </div>

    <div class="menu-grid">
        <!-- Item 1 -->
        <div class="item-card" onclick="addToCart('Pod Large')">
            <div class="item-image"><i class="fa-regular fa-image"></i></div>
            <div class="item-info">
                <h3>Pod Large</h3>
                <p>ประเภท: ตัวเครื่อง (รองรับ Infinity 2 plus...)</p>
            </div>
            <div class="tag">Disposable</div>
        </div>

        <!-- Item 2 -->
        <div class="item-card" onclick="addToCart('Creator Pod Clear')">
            <div class="item-image"><i class="fa-regular fa-image"></i></div>
            <div class="item-info">
                <h3>Creator Pod Clear</h3>
                <p>ประเภท: หัวพอต (สำหรับใช้กับเครื่อง Creator)</p>
            </div>
            <div class="tag">Disposable</div>
        </div>

        <!-- สามารถเพิ่มรายการอาหาร เช่น ซูชิ หรือ ข้าวหน้าต่างๆ ได้ที่นี่ -->
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-percent"></i><span>โปรโมชัน</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>สินค้าที่ชอบ</span></a>
        <a href="#" class="nav-item active"><i class="fa-solid fa-box-open"></i><span>สินค้า</span></a>
        <a href="#" class="nav-item cart-badge">
            <i class="fa-solid fa-cart-shopping"></i>
            <span class="badge">20</span>
            <span>รถเข็นสินค้า</span>
        </a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>โปรไฟล์</span></a>
    </nav>

    <script>
        // เริ่มต้นการใช้งาน Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // ขยายแอปให้เต็มจอ
        tg.headerColor = '#0e0e0e'; // ตั้งค่าสี Header ของแอป

        function addToCart(itemName) {
            // ฟังก์ชันจำลองการเพิ่มสินค้า
            tg.HapticFeedback.impactOccurred('light'); // สั่นเบาๆ เวลาจิ้ม
            console.log("Added to cart:", itemName);
            
            // ในอนาคตเราจะใช้ tg.sendData(JSON.stringify(order)) เพื่อส่งออเดอร์กลับไปที่ Bot
        }

        // ปรับแต่ง MainButton ของ Telegram
        tg.MainButton.text = "ดูรายการที่เลือก";
        tg.MainButton.textColor = "#000000";
        tg.MainButton.color = "#a2ff00";
        tg.MainButton.show();
    </script>
</body>
</html>
