<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STATIC Mini App - Japanese Menu</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e0e0e;
            --card-bg: #1c1c1c;
            --primary-green: #a2ff00;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo { font-size: 24px; font-weight: bold; }
        .logo span { color: var(--primary-green); }

        /* Product Card - Horizontal Style */
        .menu-container {
            padding: 0 20px 100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 30px; /* ขอบมนกว้างตามรูป */
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 20px;
            position: relative;
            overflow: hidden;
        }

        /* รูปภาพด้านซ้าย */
        .item-image-box {
            width: 120px;
            height: 120px;
            background: #2a2a2a;
            border-radius: 25px;
            overflow: hidden;
            flex-shrink: 0; /* ป้องกันรูปถูกบีบ */
        }

        .item-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ข้อความด้านขวา */
        .item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-info h3 {
            font-size: 22px;
            margin: 0 0 5px 0;
            font-weight: 700;
            line-height: 1.1;
        }

        .item-info p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
            line-height: 1.4;
        }

        /* Tag ด้านล่างขวา */
        .tag-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .tag {
            background: linear-gradient(90deg, #38ef7d, #a2ff00);
            color: black;
            font-size: 12px;
            font-weight: 800;
            padding: 6px 18px;
            border-radius: 20px;
        }

        /* Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 1px solid #222;
        }

        .nav-item { color: var(--text-muted); text-decoration: none; font-size: 10px; text-align: center; }
        .nav-item.active { color: var(--primary-green); }
        .nav-item i { display: block; font-size: 20px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">STATIC <span>•</span></div>
        <div style="color: var(--text-muted);"><i class="fa-solid fa-magnifying-glass"></i></div>
    </header>

    <div class="menu-container">
        <!-- รายการที่ 1: ใช้รูป Product.jpg -->
        <div class="item-card" onclick="selectItem('Creator Pod Clear')">
            <div class="item-image-box">
                <img src="Product.jpg" alt="Product Image">
            </div>
            <div class="item-info">
                <h3>Creator <br>Pod Clear</h3>
                <p>ประเภท: หัวพอต ใช้แล้วทิ้ง<br>ใช้ร่วมกับ Creator Device</p>
                <div class="tag-container">
                    <div class="tag">Disposable</div>
                </div>
            </div>
        </div>

        <!-- รายการที่ 2: ตัวอย่างอาหารญี่ปุ่น (ถ้าคุณมีรูปอื่นเพิ่ม) -->
        <div class="item-card" onclick="selectItem('Ebi Tempura')">
            <div class="item-image-box">
                <!-- ถ้ายังไม่มีรูปอื่นจะขึ้นเป็นสีเทา -->
                <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; color:#444;">
                    <i class="fa-regular fa-image fa-2x"></i>
                </div>
            </div>
            <div class="item-info">
                <h3>Ebi <br>Tempura</h3>
                <p>กุ้งเทมปุระทอดกรอบสไตล์ญี่ปุ่น<br>เสิร์ฟพร้อมซอสสูตรพิเศษ</p>
                <div class="tag-container">
                    <div class="tag">Best Seller</div>
                </div>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-percent"></i>โปรโมชัน</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i>สินค้าที่ชอบ</a>
        <a href="#" class="nav-item active"><i class="fa-solid fa-box-open"></i>สินค้า</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-cart-shopping"></i>รถเข็น</a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i>โปรไฟล์</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0e0e0e';

        function selectItem(name) {
            tg.HapticFeedback.impactOccurred('medium');
            console.log("Selected:", name);
            // พร้อมสำหรับระบบตะกร้าสินค้าในขั้นตอนถัดไป
        }

        tg.MainButton.text = "ดำเนินการต่อ";
        tg.MainButton.color = "#a2ff00";
        tg.MainButton.textColor = "#000000";
        tg.MainButton.show();
    </script>
</body>
</html>
