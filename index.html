<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STATIC Mini App - Grid 2 Columns</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0e0e0e;
            --card-bg: #1c1c1c;
            --primary-green: #a2ff00;
            --text-main: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Header & Search */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .logo span { color: var(--primary-green); }
        .search-bar {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            width: 55%;
        }
        .search-bar input { background: transparent; border: none; color: white; margin-left: 10px; outline: none; width: 100%; font-size: 14px; }

        /* Banner */
        .banner-container { padding: 0 20px; margin-bottom: 25px; }
        .banner-slide {
            background: #1c1c1c;
            height: 180px;
            border-radius: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Grid Layout: แถวละ 2 การ์ด */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* แบ่ง 2 คอลัมน์ */
            gap: 15px;
            padding: 0 20px 120px;
            justify-items: center;
        }

        /* Card Size: 555x318 px (Scale down for mobile screens) */
        .item-card {
            background: var(--card-bg);
            border-radius: 25px;
            display: flex;
            align-items: center;
            padding: 12px;
            gap: 12px;
            
            /* กำหนดขนาดตามโจทย์ (ใช้ max-width เพื่อให้แสดงผลในมือถือได้ไม่ล้น) */
            width: 100%; 
            max-width: 555px; 
            height: 318px; 
            box-sizing: border-box;
        }

        /* Image Size: 200x285 px */
        .item-image-box {
            width: 200px;
            height: 285px;
            background: #2a2a2a;
            border-radius: 20px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .item-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* รูปไม่เสียสัดส่วน */
        }

        .item-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 285px; /* ให้สูงเท่ารูปภาพเพื่อจัดวางข้อความ */
            justify-content: space-between;
        }

        .item-info h3 {
            font-size: 18px;
            margin: 0;
            font-weight: 700;
            line-height: 1.2;
        }

        .item-info p {
            font-size: 11px;
            color: var(--text-muted);
            margin: 5px 0 auto 0;
            line-height: 1.3;
        }

        .tag-row {
            display: flex;
            justify-content: flex-end;
        }

        .tag {
            background: linear-gradient(90deg, #38ef7d, #a2ff00);
            color: black;
            font-size: 10px;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: 12px;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
            border-top: 1px solid #222;
            z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); text-decoration: none; font-size: 10px; }
        .nav-item.active { color: var(--primary-green); }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bolt" style="color: var(--primary-green);"></i> STATIC</div>
        <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass" style="color: #444;"></i>
            <input type="text" placeholder="ค้นหาสินค้า">
        </div>
    </header>

    <div class="banner-container">
        <div class="banner-slide">
            <i class="fa-regular fa-image" style="color:#333; font-size:60px;"></i>
        </div>
    </div>

    <!-- แถวละ 2 การ์ด -->
    <div class="menu-grid">
        <!-- Card 1 -->
        <div class="item-card">
            <div class="item-image-box">
                <img src="Product.jpg" alt="Product">
            </div>
            <div class="item-info">
                <div>
                    <h3>Creator<br>Pod Clear</h3>
                    <p>ประเภท: หัวพอต<br>ใช้ร่วมกับ Creator Device</p>
                </div>
                <div class="tag-row">
                    <div class="tag">Disposable</div>
                </div>
            </div>
        </div>

        <!-- Card 2 -->
        <div class="item-card">
            <div class="item-image-box">
                <img src="Product_2.jpg" alt="Product">
            </div>
            <div class="item-info">
                <div>
                    <h3>Pod Large</h3>
                    <p>ประเภท: ตัวเครื่อง<br>รองรับ Infinity 2 plus</p>
                </div>
                <div class="tag-row">
                    <div class="tag">Device</div>
                </div>
            </div>
        </div>

        <!-- เพิ่มการ์ดอื่นๆ ได้ที่นี่ -->
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item"><i class="fa-solid fa-percent"></i><span>โปรโมชัน</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-heart"></i><span>สินค้าที่ชอบ</span></a>
        <a href="#" class="nav-item active"><i class="fa-solid fa-box-open"></i><span>สินค้า</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-cart-shopping"></i><span>รถเข็น</span></a>
        <a href="#" class="nav-item"><i class="fa-solid fa-user"></i><span>โปรไฟล์</span></a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#0e0e0e';
    </script>
</body>
</html>
