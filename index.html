<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STATIC Mini App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }

    .container {
      padding: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #9cff2e;
    }

    .search {
      margin-top: 10px;
      background: #1a1a1a;
      padding: 10px;
      border-radius: 20px;
      color: #aaa;
    }

    .banner {
      margin-top: 15px;
      height: 160px;
      background: #1a1a1a;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 10px;
    }

    .img {
      height: 90px;
      background: #333;
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .title {
      font-weight: bold;
      font-size: 14px;
    }

    .desc {
      font-size: 11px;
      color: #aaa;
      margin: 4px 0;
    }

    .tag {
      display: inline-block;
      background: linear-gradient(90deg,#9cff2e,#d7ff5f);
      color: #000;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111;
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      border-top: 1px solid #222;
    }

    .nav-item {
      text-align: center;
      font-size: 11px;
      color: #aaa;
    }

    .nav-item.active {
      color: #9cff2e;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">STATIC</div>
    </div>

    <div class="search">🔍 ค้นหาสินค้า</div>

    <div class="banner">Banner</div>

    <div class="grid">
      <div class="card">
        <div class="img"></div>
        <div class="title">Pod Large</div>
        <div class="desc">ประเภท หัวพอต ใช้แล้วทิ้ง</div>
        <div class="tag">Disposable</div>
      </div>

      <div class="card">
        <div class="img"></div>
        <div class="title">Creator Pod Clear</div>
        <div class="desc">ประเภท หัวพอต ใช้แล้วทิ้ง</div>
        <div class="tag">Disposable</div>
      </div>

      <div class="card">
        <div class="img"></div>
        <div class="title">Creator Boost Pod</div>
        <div class="desc">ประเภท เครื่อง</div>
        <div class="tag">Device</div>
      </div>

      <div class="card">
        <div class="img"></div>
        <div class="title">Marbro</div>
        <div class="desc">พอตใช้แล้วทิ้ง</div>
        <div class="tag">Disposable</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <div class="nav-item">โปรโมชัน</div>
    <div class="nav-item">สินค้าที่ชอบ</div>
    <div class="nav-item active">สินค้า</div>
    <div class="nav-item">ตะกร้า</div>
    <div class="nav-item">โปรไฟล์</div>
  </div>
</body>
</html>
